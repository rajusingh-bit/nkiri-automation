name: Nkiri movie benchmark (temporary)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of unfinished movies to process
        required: false
        default: '20'

permissions:
  contents: read

jobs:
  benchmark:
    name: One runner / ${{ inputs.limit }} unfinished movies
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NKIRI_URL: https://nkiri.vip
      NKIRI_API_TOKEN: ${{ secrets.NKIRI_API_TOKEN }}
      API_TOKEN: ${{ secrets.NKIRI_API_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      VIDFILES_API_KEY: ${{ secrets.VIDFILES_API_KEY }}
      NKIRI_MIN_FREE_GB: '4'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Start whole-job timer
        run: date -u +%s%N > /tmp/nkiri-benchmark-job-start

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reclaim disposable runner space
        run: |
          timeout 75s sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          timeout 20s sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          df -h .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Process unfinished movies and capture timing
        id: benchmark
        env:
          BENCHMARK_LIMIT: ${{ inputs.limit }}
        run: |
          set -uo pipefail
          limit="${BENCHMARK_LIMIT:-20}"
          export limit
          python3 - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          limit = int(os.environ.get('limit', '20'))
          done = set()
          for state_path in sorted(Path('fullauto').glob('state-movies-global-shard-*.json')):
              try:
                  state = json.loads(state_path.read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  continue
              for source_url, value in (state.get('processed') or {}).items():
                  status = value if isinstance(value, str) else (value.get('status') if isinstance(value, dict) else '')
                  if status == 'done' or status == 'blocked' or (isinstance(status, str) and status.startswith('skipped')):
                      done.add(source_url)

          rows = []
          with Path('queue/missing-movies.csv').open(encoding='utf-8-sig', newline='') as fh:
              for row in csv.DictReader(fh):
                  source_url = (row.get('source_url') or '').strip()
                  title = (row.get('title') or row.get('name') or '').strip()
                  if source_url and title and source_url not in done:
                      rows.append(row)
                  if len(rows) >= limit:
                      break

          if len(rows) < limit:
              raise SystemExit(f'Only {len(rows)} unfinished movie rows available; requested {limit}')

          with Path('/tmp/benchmark-movies.csv').open('w', encoding='utf-8', newline='') as fh:
              writer = csv.DictWriter(fh, fieldnames=rows[0].keys())
              writer.writeheader()
              writer.writerows(rows)
          print(f'selected_unfinished_movies={len(rows)}')
          for index, row in enumerate(rows, 1):
              print(f"selected_{index:02d}={(row.get('title') or row.get('name') or '').strip()}")
          PY

          process_start_ns=$(date +%s%N)
          echo "benchmark_process_start_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          python fullauto/nkiri_agent.py \
            --once \
            --queue-file /tmp/benchmark-movies.csv \
            --state-file /tmp/benchmark-state.json \
            --limit "$limit" \
            --no-sync 2>&1 | tee /tmp/benchmark.log
          agent_exit=${PIPESTATUS[0]}
          set -e
          process_end_ns=$(date +%s%N)
          job_start_ns=$(cat /tmp/nkiri-benchmark-job-start)
          export process_start_ns process_end_ns job_start_ns agent_exit

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          def seconds(start, end):
              return (int(end) - int(start)) / 1_000_000_000

          log = Path('/tmp/benchmark.log').read_text(encoding='utf-8', errors='replace')
          selected = len(re.findall(r'^selected_\d+=', log, re.M))
          processed = len(re.findall(r'processing \[movie\]', log))
          site_posts = len(re.findall(r'✓ site:', log))
          uploaded_files = len(re.findall(r'✓ uploaded', log))
          download_failures = len(re.findall(r'✗ download failed', log))
          upload_failures = len(re.findall(r'✗ upload failed', log))
          no_direct = len(re.findall(r'✗ no direct URL', log))
          print('## Nkiri movie benchmark')
          print(f"- Started: `{datetime.fromtimestamp(int(os.environ['job_start_ns']) / 1_000_000_000, timezone.utc).isoformat()}`")
          print(f"- Whole job duration: `{seconds(os.environ['job_start_ns'], os.environ['process_end_ns']):.1f} seconds`")
          print(f"- Processing duration: `{seconds(os.environ['process_start_ns'], os.environ['process_end_ns']):.1f} seconds`")
          print(f'- Selected unfinished movies: `{selected}`')
          print(f'- Movie posts attempted: `{processed}`')
          print(f'- Site posts completed: `{site_posts}`')
          print(f'- VidFiles uploaded files: `{uploaded_files}`')
          print(f'- Download failures: `{download_failures}`')
          print(f'- Upload failures: `{upload_failures}`')
          print(f'- Direct-link failures: `{no_direct}`')
          print(f"- Agent exit code: `{os.environ['agent_exit']}`")
          PY
          exit "$agent_exit"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nkiri-movie-benchmark-${{ github.run_id }}
          path: |
            /tmp/benchmark.log
            /tmp/benchmark-movies.csv
            /tmp/benchmark-state.json
          if-no-files-found: ignore
